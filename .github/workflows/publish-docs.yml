# GitHub Pages deploy for the docs site in ./website (which also embeds the
# metadata web wizard, built from ./packages/frontend).
#
# Requires GitHub Pages to be enabled with the "GitHub Actions" source in the
# repository settings. Publishes to https://metadata.jspsych.org (custom domain
# set via website/static/CNAME).

name: Publish Docs

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'packages/frontend/**'
      # The deployed wizard bundles the LOCAL @jspsych/metadata, so library
      # changes must redeploy it too.
      - 'packages/metadata/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

# Only allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Docusaurus can show last-updated times

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      # Install the monorepo workspaces so the wizard (packages/frontend) builds
      # against the LOCAL @jspsych/metadata, and build that package so its dist/
      # exists before the wizard's `tsc -b && vite build`.
      - name: Install workspace dependencies
        run: npm ci

      - name: Build @jspsych/metadata
        run: npm run build --workspace=@jspsych/metadata

      # The docs site is a standalone project (not part of the root workspaces).
      # `npm run build` here triggers build:wizard, which builds packages/frontend
      # with VITE_BASE=/wizard-app/ and copies it into static/wizard-app/.
      - name: Install docs-site dependencies
        working-directory: ./website
        run: npm ci

      - name: Build docs site
        working-directory: ./website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
