<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsPsych Metadata Generator</title>
    <script>
      (function () {
        // ?theme= is passed by the docs site when embedding the wizard in an
        // iframe — honor it first so the first paint matches the host page.
        var t = new URLSearchParams(location.search).get('theme');
        if (t !== 'dark' && t !== 'light') t = localStorage.getItem('theme');
        document.documentElement.dataset.theme =
          (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
